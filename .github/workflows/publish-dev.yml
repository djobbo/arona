name: Publish dev
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (optional)"
        required: false
        type: string
  push:
    branches:
      - master
    paths:
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm test

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    if: github.repository_owner == 'djobbo'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "@arona/core"
            folder: packages/core
          - name: "@arona/discord"
            folder: packages/discord
          - name: "@arona/slack"
            folder: packages/slack
          - name: create-arona-app
            folder: packages/create-arona-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Setup npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_PUBLISH_TOKEN" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      - name: Publish to npm
        run: |
          if [ -n "${{ github.event.inputs.package }}" ] && [ "${{ github.event.inputs.package }}" != "${{ matrix.name }}" ]; then
            echo "Skipping ${{ matrix.name }}"
            exit 0
          fi
          pnpm exec vpx ./scripts/publish-dev.ts ${{ matrix.name }} ${{ matrix.folder }}
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
