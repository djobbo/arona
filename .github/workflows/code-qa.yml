name: Code QA
on: [push, pull_request]
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Check
            action: pnpm exec vp check
          - name: Test
            action: pnpm test
          - name: Build
            action: pnpm build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: ${{ matrix.name }}
        run: |
          pnpm install --frozen-lockfile
          ${{ matrix.action }}
